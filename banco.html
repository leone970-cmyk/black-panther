<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Black Panther · Banco de treinos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<meta name="robots" content="noindex">
<style>

:root{
 --bg:#0b0b12;--surface:#1d1826;--surface2:#261e33;--ink:#EEF1F5;--muted:#8D97A6;--line:#3b2e4b;
 --blue:#3B7BF2;--blue-ink:#9DBEFF;--blue-bg:#14284D;--gold:#E8B931;--gold-bg:#3A300F;--gold-ink:#F5D778;--danger:#F0545A;
 --pro:#F0545A;--wod:#3B7BF2;--bsb:#3DBB84;--tp:#3BB0EA;--accent:var(--blue);
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b12;--surface:#1d1826;--surface2:#261e33;--ink:#EEF1F5;--muted:#8D97A6;--line:#3b2e4b}}
:root[data-theme="dark"]{--bg:#0b0b12;--surface:#1d1826;--surface2:#261e33;--ink:#EEF1F5;--muted:#8D97A6;--line:#3b2e4b}
:root[data-theme="light"]{--bg:#EEF0F3;--surface:#FFFFFF;--surface2:#F4F6F9;--ink:#10151C;--muted:#5A6573;--line:#D6DBE2;--blue-bg:#E3ECFF;--blue-ink:#1D58C2;--gold-bg:#FFF4CC;--gold-ink:#6B4E00;color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 170px)}
body{margin:0;background:radial-gradient(ellipse 90% 45% at 85% 0%,#44206655,transparent 70%) fixed,var(--bg);color:var(--ink);font:400 16px/1.5 Barlow,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
a{color:inherit}
.hidden{display:none!important}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.wrap{max-width:1000px;margin:0 auto;padding:0 14px}
.bar{display:flex;align-items:center;gap:10px;padding:12px 0 8px}
.mark{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.mark svg{flex:none}
.mark b{font:800 21px/1 "Barlow Condensed",sans-serif;letter-spacing:1.5px}
.mark span{display:block;font:600 12px/1.2 Barlow,sans-serif;color:var(--muted);letter-spacing:.5px}
.ath{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 8px 6px 10px;cursor:pointer;max-width:48%}
.ath small{color:var(--muted);font-size:12px}
.ath strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-bottom:8px}
.nav button{border:0;border-radius:10px;padding:10px 6px;background:var(--surface);font:700 16px/1 "Barlow Condensed",sans-serif;letter-spacing:.3px;cursor:pointer;position:relative}
.nav button[aria-pressed="true"]{background:var(--blue);color:#fff}
.count{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--gold);color:#221a00;font:700 12px/18px Barlow,sans-serif}
.row{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}.row::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.src .chip[aria-pressed="true"]{color:#0A0C10}
.tools{display:flex;gap:6px;padding-bottom:10px}
.search{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}
.tg{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.tg[aria-pressed="true"]{background:var(--blue-bg);border-color:var(--blue);color:var(--blue-ink)}
main{padding:14px 0 120px}
h2.t{margin:2px 0 4px;font:800 30px/1 "Barlow Condensed",sans-serif;color:var(--accent)}
p.s{margin:0 0 6px;color:var(--muted)}
.week h3{font:700 21px/1.1 "Barlow Condensed",sans-serif;margin:22px 0 10px;display:flex;gap:10px;align-items:baseline}
.week h3 small{font:500 13px Barlow,sans-serif;color:var(--muted)}
details.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:0 0 8px;overflow:hidden}
details.day.used{border-color:var(--blue)}
details.day>summary{list-style:none;cursor:pointer;padding:11px 12px;display:flex;align-items:center;gap:10px}
details.day>summary::-webkit-details-marker{display:none}
.dn{flex:none;width:44px;height:44px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;font:800 18px/1 "Barlow Condensed",sans-serif}
.used .dn{background:var(--blue);color:#fff}
.ds{flex:1;min-width:0}.ds b{display:block;font:700 17px/1.2 "Barlow Condensed",sans-serif}
.ds span{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.add{flex:none;border:1px solid var(--blue);background:transparent;color:var(--blue-ink);border-radius:9px;padding:7px 10px;font-weight:700;font-size:13px;cursor:pointer}
.add:active{background:var(--blue);color:#fff}
ol.ex{list-style:none;margin:0;padding:0 12px 8px}
ol.ex li{border-top:1px solid var(--line);padding:9px 0;display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:start}
ol.ex li.sec{display:block;padding:11px 0 2px;border:0;font:700 15px/1.2 "Barlow Condensed",sans-serif;color:var(--accent)}
ol.ex li.sess{display:block;margin-top:6px;padding:6px 0;font:800 15px/1.2 "Barlow Condensed",sans-serif;color:var(--muted);border-top:2px solid var(--line)}
.nm{font-weight:600;text-decoration:none;border-bottom:1px dotted var(--muted)}
.nm:hover{color:var(--blue-ink)}
.pr{grid-column:1;font-size:15px;white-space:pre-line}
.meta{grid-column:1;display:flex;flex-wrap:wrap;gap:5px;font-size:12.5px}
.meta span{background:var(--surface2);border-radius:6px;padding:1px 7px}
.meta .obs{background:none;padding:0;color:var(--muted);font-size:13.5px;flex-basis:100%}
.falta{grid-column:1/-1;background:var(--gold-bg);color:var(--gold-ink);border-left:4px solid var(--gold);border-radius:6px;padding:5px 9px;font-size:13.5px;font-weight:600}
.vids{grid-column:1;display:flex;gap:6px;flex-wrap:wrap}.vids a{font-size:12.5px;font-weight:700;color:var(--blue-ink);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:1px 8px}
.use{grid-column:2;grid-row:1/span 3;border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.use.on{background:var(--blue);border-color:var(--blue);color:#fff}
.uinfo{grid-column:1;font-size:12px;color:var(--blue-ink);font-weight:600}
/* planner */
.wk{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.wk label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:3px}
.wk input,.wk select,.ed textarea,.ed input{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:8px 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pday{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.pday>header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface2)}
.pday>header b{flex:1;font:800 19px/1 "Barlow Condensed",sans-serif;letter-spacing:.3px}
.pday>header small{color:var(--muted);font-size:13px}
.ses{border-top:1px solid var(--line);padding:10px 12px}
.ses .sh{display:flex;gap:6px;align-items:center}
.ses .sh input{flex:1;font-weight:700;border:0;background:transparent;padding:2px 0;border-bottom:1px dashed var(--line);border-radius:0}
.src-tag{font-size:12px;color:var(--muted);margin:2px 0 6px}
.it{display:grid;grid-template-columns:1fr auto;gap:4px 6px;padding:6px 0;border-top:1px dashed var(--line)}
.it input,.it textarea{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:7px;padding:5px 8px;font-size:14px}
.it input{font-weight:600;grid-column:1}.it textarea{grid-column:1}.it .ib{grid-column:2;grid-row:1/span 3}
.it textarea{min-height:34px;resize:vertical}
.it .warn{grid-column:1;font-size:12px;color:var(--gold-ink);font-weight:600}
.ib{display:flex;flex-direction:column;gap:4px}
.mini{border:1px solid var(--line);background:var(--surface2);border-radius:7px;width:30px;height:28px;cursor:pointer;font-size:14px;line-height:1}
.mini.x{color:var(--danger)}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:8px 11px;font-weight:700;font-size:13.5px;cursor:pointer}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.g{background:#1FA855;border-color:#1FA855;color:#fff}
.btn.d{color:var(--danger)}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
.hist{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.hist div{flex:1;min-width:0}.hist b{display:block}.hist small{color:var(--muted)}
.lib{columns:2 280px;column-gap:22px}
.lib h4{font:800 22px/1 "Barlow Condensed",sans-serif;color:var(--blue);margin:16px 0 6px;break-after:avoid}
.lib div{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);padding:4px 0;break-inside:avoid}
.lib a{flex:1;text-decoration:none;padding:2px 0}
.lib a:hover{color:var(--blue-ink)}
/* sheet */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:85vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h4{margin:0 0 10px;font:800 22px/1 "Barlow Condensed",sans-serif}
.opt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 12px;margin-bottom:6px;cursor:pointer;font-weight:600}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-bg);color:var(--blue-ink)}
.opt small{margin-left:auto;color:var(--muted);font-weight:500}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:40;max-width:90vw}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px rgba(0,0,0,.35)}
.dock .in{max-width:1000px;margin:0 auto}
.dock .l1{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px;color:var(--muted)}
.dock .l1 b{color:var(--ink)}
.dock .l1 button{margin-left:auto}
.dock .dd{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dock .dd button{border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:6px 0 4px;cursor:pointer;font:700 14px/1 "Barlow Condensed",sans-serif;position:relative}
.dock .dd button small{display:block;font:600 11px/1.3 Barlow,sans-serif;color:var(--muted)}
.dock .dd button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.dock .dd button[aria-pressed="true"] small{color:#DCE7FF}
.ad{grid-column:2;grid-row:1/span 3;border:1px solid var(--blue);background:transparent;color:var(--blue-ink);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.ad.on{background:var(--blue);color:#fff}
.done{grid-column:1;font-size:12px;color:var(--gold-ink);font-weight:600}
main.withdock{padding-bottom:170px}
.ia-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.ia-card h4{margin:0 0 8px;font:800 19px/1.1 "Barlow Condensed",sans-serif}
.dom{display:grid;grid-template-columns:118px 1fr 44px;gap:8px;align-items:center;font-size:13.5px;padding:3px 0}
.dom .tr{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.dom .tr i{display:block;height:100%;background:var(--blue);border-radius:99px}
.dom.low .tr i{background:var(--gold)}
.dom b{text-align:right;font-weight:700}
.pri{border-top:1px solid var(--line);padding:10px 0}
.pri:first-of-type{border-top:0;padding-top:0}
.pri h5{margin:0;font:800 17px/1.2 "Barlow Condensed",sans-serif;color:var(--gold-ink)}
.pri p{margin:4px 0;font-size:14.5px}
.cite{display:inline-block;font-size:12px;color:var(--muted);margin-right:8px}
.cite a{color:var(--blue-ink)}
.sug{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;background:var(--surface2);border-radius:9px;padding:8px 10px;margin-top:6px}
.sug b{font-weight:700}.sug small{grid-column:1;color:var(--muted);font-size:12.5px;white-space:pre-line}
.sug .ad{grid-row:1/span 2}
.ia-out{white-space:pre-line;font-size:15px}
.bpi{display:inline-block;background:linear-gradient(90deg,#1D58C2,#3B7BF2);color:#fff;border-radius:6px;padding:0 7px;font:700 11.5px/18px Barlow,sans-serif;letter-spacing:.3px;vertical-align:1px;margin-left:4px}
.kb details{border-top:1px solid var(--line);padding:6px 0}.kb summary{cursor:pointer;font-weight:600}.kb li{font-size:13.5px;margin:2px 0}
.qa textarea{width:100%;min-height:70px;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:8px 10px;resize:vertical}
.seqb{grid-column:1;justify-self:start;border:1px dashed var(--blue);background:transparent;color:var(--blue-ink);border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700;cursor:pointer;margin-top:2px}
.steps{max-height:52vh;overflow:auto;margin:6px 0}
.step{display:grid;grid-template-columns:40px 1fr auto;gap:2px 8px;align-items:center;border-top:1px solid var(--line);padding:7px 0}
.step b{font:800 16px/1 "Barlow Condensed",sans-serif;color:var(--muted)}
.step small{color:var(--muted);font-size:12px;display:block}
.step.cur b{color:var(--blue)}
.seqcard{background:var(--surface);border:1px solid var(--blue);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.seqcard h4{margin:0 0 6px;font:800 18px/1.1 "Barlow Condensed",sans-serif}
.seqrow{border-top:1px solid var(--line);padding:8px 0}
.seqrow p{margin:2px 0;font-size:14px;white-space:pre-line}
.pill{display:inline-block;background:var(--blue-bg);color:var(--blue-ink);border-radius:999px;padding:0 8px;font-size:12px;font-weight:700}
.chk{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.chk input{width:20px;height:20px;margin-top:2px}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--blue);color:#fff;border:0;border-radius:999px;padding:12px 16px;font:800 15px/1 "Barlow Condensed",sans-serif;letter-spacing:.4px;box-shadow:0 6px 20px rgba(0,0,0,.45);cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* integração com o app */
.back{display:flex;align-items:center;justify-content:center;flex:none;width:36px;height:36px;border-radius:10px;background:var(--surface);border:1px solid var(--line);text-decoration:none;font-size:19px;font-weight:700}
.gate{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.gate p{color:var(--muted);margin:0 0 16px;font-size:16px;max-width:420px}
.gate .btn{text-decoration:none;display:inline-block}
.marks{display:grid;gap:6px;margin:10px 0}
.marks div{display:flex;justify-content:space-between;gap:10px;background:var(--surface2);border-radius:8px;padding:8px 10px;font-size:14px}
.marks span{color:var(--muted)}
/* conflito entre aparelhos */
.confbox{border:1px solid #f0b429;background:rgba(240,180,41,.08);border-radius:12px;padding:12px 14px;margin:0 0 14px}
.confbox>b{display:block;color:#f0b429;margin-bottom:6px}
.confrow{border-top:1px solid rgba(255,255,255,.08);padding-top:8px;margin-top:8px}
.confrow p{margin:0 0 6px}.confrow .s{opacity:.8;font-size:13px}
/* semana aberta do plano, resultados do aluno e escolha de semana na BP IA */
.linkbox{background:var(--blue-bg,#eef4ff);border:1px solid var(--blue,#4a6cf7);border-radius:12px;padding:10px 12px;margin:10px 0}.linkbox p{margin:4px 0 8px;font-size:13px}
.resline{font-size:12px;color:var(--blue-ink,#2c4fd6);margin:2px 0 4px}.pill.ok{background:#dff6ec;color:#11734b}
.hist.on{border-color:var(--blue,#4a6cf7)}
.wprev{margin:10px 0;display:flex;flex-direction:column;gap:8px}.wpday>b{display:block;font-size:13px;margin-bottom:4px}
.wpses{border:1px solid var(--line,#ddd);border-left:3px solid var(--line,#ddd);border-radius:10px;padding:6px 8px;margin-bottom:4px;font-size:13px}.wpses.done{border-left-color:#22c993}.wpses small{display:block;color:var(--muted,#666);font-size:12px;margin-top:2px}
.pwk{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.pwk div{flex:1;min-width:0}.pwk b{display:block}.pwk small{color:var(--muted)}.pwk.on{border-color:var(--blue,#4a6cf7)}
/* semana em lista (texto) */
.wmode{display:flex;gap:6px;margin:10px 0}.wmode button{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px;font-weight:700;cursor:pointer}.wmode button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.namebtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.mini2{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}
.wlist{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}.wlist .chips{display:flex;flex-wrap:wrap;gap:6px}.wlist .chip{font-size:13px;padding:5px 11px}
#wtxt{width:100%;min-height:420px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;resize:vertical}
.lprev{display:flex;flex-direction:column;gap:4px}.lpday{font-size:13px;border-left:3px solid var(--blue);padding:2px 8px}.lpday span{color:var(--ink)}.lpday small{display:block;color:var(--muted)}
.tsel{width:100%}
/* enviar para outros alunos / grupo: lista com caixas de marcar */
.sheet .lbl{font-weight:700;margin:10px 0 4px;color:var(--ink)}
.opt.chk{cursor:pointer;font-weight:600}.opt.chk input{width:18px;height:18px;margin:0;accent-color:var(--blue);flex-shrink:0}
.opt.chk span{display:flex;flex-direction:column;gap:2px;min-width:0}.opt.chk span small{margin-left:0;font-weight:500;color:var(--muted);white-space:normal}
.opt.chk:has(input:checked){border-color:var(--blue);background:var(--blue-bg);color:var(--blue-ink)}

/* orientações do bloco (texto que o aluno vê em "Ver") nos cartões da semana */
.ses .sdesc{display:block;width:100%;box-sizing:border-box;margin:6px 0 2px;padding:8px 10px;border:1px dashed var(--line);border-radius:8px;background:var(--surface2);color:var(--ink);font:13px/1.5 inherit;resize:vertical}
.ses .sdesc::placeholder{color:var(--muted)}.mini.sdesc-add{width:auto;height:auto;margin:4px 0 2px;padding:3px 10px;font-size:12px;white-space:nowrap;color:var(--muted)}
.ia-meta{margin-top:8px;font-size:13px;color:#eadcff;background:#1d1529;border:1px solid #4a3566;border-radius:9px;padding:8px 10px}
/* ===== mistura: letras e cores dos programas do protótipo + topo, pantera, botões e fundo roxo do Black Panther ===== */
:root{--blue:#8950cf;--blue-ink:#d5acfa;--blue-bg:#2a1c38}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 200px)}

/* topo e pantera do app */
.bp-head{background:#0d0d16;border-bottom:1px solid #282332}
.bp-head .wrap{display:flex;align-items:center;gap:12px;padding-top:12px;padding-bottom:12px}
.back{background:#1b1726;border-color:#3d304e;color:#d7c8e9}
.bp-mark{font:800 21px/1 "Barlow Condensed",sans-serif;letter-spacing:1.5px;color:#f1eff7}
.bp-mark b{color:#b282f3}
.bp-mark small{display:block;font:600 11px/1.2 Barlow,sans-serif;letter-spacing:1.2px;color:#a09aa9;margin:4px 0 0 14px}
.brand-dot{display:inline-block;width:5px;height:5px;background:#b282f3;box-shadow:0 0 10px #ae6bfd;border-radius:50%;margin-right:9px;vertical-align:middle}
.bp-hero{position:relative;overflow:hidden;background:radial-gradient(ellipse at 90% 60%,#44206666,transparent 68%);border-bottom:1px solid #292035}
.bp-hero .wrap{position:relative;min-height:138px;display:flex;align-items:center;padding-top:14px;padding-bottom:14px}
.bp-hero-img{position:absolute;right:4px;top:2px;width:136px;height:136px;object-fit:contain;opacity:.85;filter:drop-shadow(0 10px 20px #0008);pointer-events:none}
.bp-hero-copy{position:relative;z-index:1;max-width:66%}
.athlete-label{font:600 10px/1 Barlow,sans-serif;letter-spacing:2.3px;color:#bb8eea}
.bp-hero h1{font:600 32px/1 "Barlow Condensed",sans-serif;letter-spacing:.2px;margin:8px 0 6px;color:#e5dfef}
.bp-hero h1 strong{font-weight:800;color:#fff}
.bp-hero p{font-size:13px;color:#b0a5c1;margin:0}

/* barra fixa: atleta no padrão do app */
.top{background:#0d0d16f2;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.bar{padding:10px 0 8px}
.ath{flex:1;max-width:none;background:linear-gradient(140deg,#251b31,#14111e);border-color:#493357;border-radius:12px;padding:8px 12px}
.ath div{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1;text-align:left}
.ath div br{display:none}
.ath small{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:#a985cd}
.ath strong{font-size:16px;color:#f4ecfd}
.ath svg{color:#d6b0ff}

/* cartões com o degradê roxo do app */
details.day,.pday,.wk,.hist,.ia-card{background:linear-gradient(140deg,#251b31,#14111e);border-color:#493357}
.seqcard{background:linear-gradient(140deg,#251b31,#14111e)}
.pday>header{background:#211b2b}
.dn{background:#2a1c38;color:#e1c4fa}
.used .dn{color:#fff}
.btn.p,.fab{box-shadow:0 4px 14px #8950cf40}
.bpi{background:linear-gradient(90deg,#6d3fc0,#9255ef)}
.dock{background:#0d0d16;border-top-color:#282332}
.dock .dd button[aria-pressed="true"] small{color:#eadcff}
.it .it-src{grid-column:1;margin:0;font-size:11.5px;color:#a985cd}
.ia-fontes b{color:var(--ink)}

</style>
</head>
